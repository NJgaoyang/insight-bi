name: Analysis Phase2 Pivot Scoped
on:
  workflow_dispatch:
  push:
    branches:
      - feat/finebi-analysis-engine-p0
    paths:
      - backend/src/main/java/com/insightbi/analysis/AnalysisQueryPlanner.java
      - backend/src/main/java/com/insightbi/analysis/AnalysisApi.java
      - backend/src/main/java/com/insightbi/analysis/PivotRollup.java
      - backend/src/main/java/com/insightbi/ReaderApi.java
      - backend/src/test/java/com/insightbi/analysis/AnalysisPivotRollupTest.java
      - backend/src/test/java/com/insightbi/analysis/AnalysisPivotHierarchyTest.java
      - backend/src/test/java/com/insightbi/analysis/AnalysisPivotApiIntegrationTest.java
      - backend/src/test/java/com/insightbi/ReaderApiTest.java
      - backend/src/test/java/com/insightbi/analysis/AnalysisPivotGroupedQueryTest.java
      - frontend/src/AnalysisSubject.vue
      - frontend/src/AnalysisV2Chart.vue
      - frontend/src/api.ts
      - frontend/src/style.css
      - frontend/src/analysis/pivotTable.ts
      - scripts/analysis_phase2_pivot.test.mjs
      - scripts/analysis_phase2_pivot_browser_smoke.cjs
      - scripts/analysis_phase2_pivot_rollup_browser_smoke.cjs
      - scripts/analysis_phase2_pivot_hierarchy_browser_smoke.cjs
      - .github/workflows/analysis-phase2-pivot-scoped.yml

jobs:
  scoped-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: H2 planner + pivot aggregate/metadata checks only
        working-directory: backend
        run: mvn -q -Dtest=AnalysisPivotGroupedQueryTest,AnalysisQueryPlannerTest,AnalysisPivotRollupTest,AnalysisPivotApiIntegrationTest,AnalysisPivotHierarchyTest,ReaderApiTest test

  scoped-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pure pivot transformation cases
        run: node --experimental-strip-types --test scripts/analysis_phase2_pivot.test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: TypeScript check and Vite build
        working-directory: frontend
        run: npm run build
      - name: Install isolated Chromium for mock REST smoke
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start isolated static preview
        run: |
          python3 -m http.server 18213 --bind 127.0.0.1 --directory frontend/dist > /tmp/phase2-pivot-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18213/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase2-pivot-preview.log
          exit 1
      - name: Chromium editor/save/reload/published snapshot and pagination
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18213
        run: |
          node scripts/analysis_phase2_pivot_browser_smoke.cjs
          node scripts/analysis_phase2_pivot_rollup_browser_smoke.cjs
          node scripts/analysis_phase2_pivot_hierarchy_browser_smoke.cjs
