name: P0 Analysis Engine Checks
on:
  push:
    branches:
      - feat/finebi-analysis-engine-p0
  pull_request:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Targeted API, compiler and compatibility tests
        working-directory: backend
        run: mvn -B -q -Dtest=BiQueryInTest,FineBiWorkspaceFolderTest,AnalysisQueryPlannerTest,AnalysisEngineSqlExecutionTest,AnalysisFormulaDependencyTest,ReadOnlySqlGuardTest,AnalysisQueryBoundaryTest,FieldCatalogRefreshTest test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check browser smoke test syntax
        run: |
          node --check scripts/finebi_multifield_ui_smoke.cjs
          node --check scripts/finebi_formula_ui_smoke.cjs
          bash -n scripts/deploy.sh
          bash -n scripts/p0_starrocks_readonly_e2e.sh
      - name: TypeScript and Vite production compilation
        working-directory: frontend
        run: npm run build
