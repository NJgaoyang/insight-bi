name: P1 Model Relations Scoped
on:
  workflow_dispatch:
  push:
    branches:
      - feat/finebi-analysis-engine-p0
    paths:
      - backend/src/main/java/com/insightbi/analysis/ModelRelationsApi.java
      - backend/src/test/java/com/insightbi/analysis/ModelRelationsApiTest.java
      - frontend/src/ModelRelations.vue
      - frontend/src/App.vue
      - frontend/src/style.css
      - scripts/model_relations_browser_smoke.cjs
      - docs/P1_MODEL_RELATIONS_CATALOG_01.md
      - .github/workflows/model-relations-scoped.yml
jobs:
  model-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test model relation source, stale and unsafe configurations
        working-directory: backend
        run: mvn -q -B -Dtest=ModelRelationsApiTest,AnalysisPipelineJoinTest test
  model-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Vue TS and Vite scoped bundle
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start isolated preview
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 18221 > /tmp/model-relations-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18221/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/model-relations-preview.log
          exit 1
      - name: Verify model relationship list and edit navigation
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18221
        run: node scripts/model_relations_browser_smoke.cjs
