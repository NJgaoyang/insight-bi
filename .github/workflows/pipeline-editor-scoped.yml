name: P0 Pipeline Editor Scoped
on:
  workflow_dispatch:
  push:
    branches:
      - feat/finebi-analysis-engine-p0
    paths:
      - frontend/src/PipelineEditor.vue
      - frontend/src/analysis/pipelineDependencies.ts
      - frontend/src/analysis/pipelineRelationGraph.ts
      - scripts/pipeline_relation_graph.test.mjs
      - docs/PIPELINE_RELATION_GRAPH_BATCH1.md
      - docs/PIPELINE_RELATION_IMPACT_BATCH2.md
      - scripts/pipeline_dependencies.test.mjs
      - docs/PIPELINE_EDITOR_PHASE2_BATCH4_DEPENDENCIES.md
      - frontend/src/analysis/joinPreflight.ts
      - frontend/src/analysis/joinCardinality.ts
      - scripts/pipeline_join_cardinality.test.mjs
      - docs/PIPELINE_JOIN_CARDINALITY_BATCH3.md
      - backend/src/main/java/com/insightbi/analysis/AnalysisPipelineApi.java
      - backend/src/main/java/com/insightbi/analysis/PipelineChangeImpact.java
      - backend/src/test/java/com/insightbi/analysis/PipelineChangeImpactTest.java
      - docs/PIPELINE_PUBLISHED_IMPACT_GUARD_01.md
      - backend/src/test/java/com/insightbi/analysis/AnalysisPipelineJoinTest.java
      - scripts/pipeline_join_preflight.test.mjs
      - scripts/finebi_pipeline_join_ui_smoke.cjs
      - docs/PIPELINE_EDITOR_PHASE2_BATCH3_JOIN.md
      - backend/src/main/java/com/insightbi/analysis/AnalysisPipelineCompiler.java
      - backend/src/test/java/com/insightbi/analysis/AnalysisPipelineCastTest.java
      - scripts/pipeline_cast_browser_smoke.cjs
      - docs/PIPELINE_EDITOR_PHASE2_BATCH2_CAST.md
      - frontend/src/analysis/pipelineEditing.ts
      - scripts/pipeline_editor_step.test.mjs
      - scripts/pipeline_editor_browser_smoke.cjs
      - docs/PIPELINE_EDITOR_PHASE2_BATCH1.md
      - .github/workflows/pipeline-editor-scoped.yml
jobs:
  focused-pipeline-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test safe copies, preview and JOIN preflight
        run: node --experimental-strip-types --test scripts/pipeline_editor_step.test.mjs scripts/pipeline_join_preflight.test.mjs scripts/pipeline_dependencies.test.mjs scripts/pipeline_join_cardinality.test.mjs scripts/pipeline_relation_graph.test.mjs
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check and Vite bundle
        working-directory: frontend
        run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start isolated Vite page
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 18216 > /tmp/pipeline-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18216/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/pipeline-preview.log
          exit 1
      - name: Chromium copy undo preview save reload
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18216
        run: node scripts/pipeline_editor_browser_smoke.cjs
      - name: Chromium controlled type cast preview save reload
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18216
        run: node scripts/pipeline_cast_browser_smoke.cjs
      - name: Chromium same-connection JOIN acknowledgment and save
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18216
        run: node scripts/finebi_pipeline_join_ui_smoke.cjs
  pipeline-cast-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Real H2 type conversion and existing pipeline compiler checks
        working-directory: backend
        run: mvn -B -q -Dtest=PipelineChangeImpactTest,AnalysisPipelineApiTest,AnalysisPipelineJoinTest,AnalysisPipelineCastTest,AnalysisPipelineCompilerTest test
