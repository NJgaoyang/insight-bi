name: P1 Semantic Relationship Drafts Scoped
on:
  workflow_dispatch:
  push:
    branches:
      - feat/finebi-analysis-engine-p0
    paths:
      - backend/src/main/java/com/insightbi/DatabaseStore.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationApi.java
      - backend/src/main/java/com/insightbi/analysis/SemanticDashboardDraftBindingGuard.java
      - backend/src/main/java/com/insightbi/BiApi.java
      - backend/src/main/java/com/insightbi/ReaderColumnGuard.java
      - backend/src/main/java/com/insightbi/analysis/AnalysisApi.java
      - backend/src/test/java/com/insightbi/SemanticDashboardDraftBindingTest.java
      - backend/src/main/java/com/insightbi/GovernanceApi.java
      - backend/src/test/java/com/insightbi/GovernanceApiTest.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationAccessReview.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationSourceFingerprint.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationCardinalityProfile.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationSqlPreview.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsPlanPreview.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsPlanSnapshot.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsBindPreflight.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsExecutionBoundary.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsRevocationGate.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsSourceGrantGate.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsSourceIdentityGate.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsTlsConnectionFactory.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationRlsTlsConnectionFactoryTest.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsExecutionLifecycle.java
      - backend/src/main/java/com/insightbi/analysis/SemanticRelationRlsApprovedSourceGate.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationRlsExecutionLifecycleTest.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationRlsRevocationGateTest.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationRlsExecutionBoundaryTest.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationRlsPlanPreviewTest.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationApiTest.java
      - backend/src/test/java/com/insightbi/analysis/SemanticRelationCardinalityProfileTest.java
      - frontend/src/SemanticRelationDrafts.vue
      - frontend/src/ModelRelations.vue
      - frontend/src/style.css
      - scripts/semantic_relation_drafts_browser_smoke.cjs
      - docs/P1_SEMANTIC_RELATION_DRAFT_01.md
      - docs/P1_SEMANTIC_RELATION_COMPILE_03.md
      - docs/P1_SEMANTIC_RELATION_SOURCE_PIN_04.md
      - docs/P1_SEMANTIC_RELATION_CARDINALITY_05.md
      - docs/P1_SEMANTIC_RELATION_ACCESS_REVIEW_06.md
      - docs/P1_SEMANTIC_RELATION_SNAPSHOT_07.md
      - docs/P1_SEMANTIC_DASHBOARD_DRAFT_BINDING_08.md
      - docs/P1_SEMANTIC_RELATION_DUAL_RLS_PLAN_09.md
      - docs/P1_SEMANTIC_RLS_PLAN_SNAPSHOT_12.md
      - docs/P1_SEMANTIC_RLS_BIND_PREFLIGHT_13.md
      - docs/P1_SEMANTIC_RLS_EXECUTION_BOUNDARY_14.md
      - docs/P1_SEMANTIC_RLS_PREEXEC_AUTH_15.md
      - docs/P1_SEMANTIC_RLS_EXECUTION_LIFECYCLE_16.md
      - docs/P1_SEMANTIC_RLS_SOURCE_APPROVAL_BINDING_17.md
      - docs/P1_SEMANTIC_RLS_JDBC_IDENTITY_18.md
      - docs/P1_SEMANTIC_RLS_TLS_CONNECTION_19.md
      - .github/workflows/semantic-relation-scoped.yml
jobs:
  relationship-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Bounded metadata draft CRUD and H2 compatibility
        working-directory: backend
        run: mvn -q -B -Dtest=SemanticRelationApiTest,SemanticRelationRlsPlanPreviewTest,SemanticRelationRlsExecutionBoundaryTest,SemanticRelationRlsRevocationGateTest,SemanticRelationRlsExecutionLifecycleTest,SemanticRelationRlsTlsConnectionFactoryTest,SemanticRelationCardinalityProfileTest,ModelRelationsApiTest,GovernanceApiTest,SemanticDashboardDraftBindingTest test
  relationship-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and Vite build
        working-directory: frontend
        run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start isolated page
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 18225 > /tmp/semantic-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18225/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/semantic-preview.log
          exit 1
      - name: Chromium metadata draft create edit delete
        env:
          P0_PREVIEW_URL: http://127.0.0.1:18225
        run: node scripts/semantic_relation_drafts_browser_smoke.cjs
